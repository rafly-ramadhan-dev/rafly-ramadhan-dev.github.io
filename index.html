  const p=S.me+'/'+Date.now()+'.'+ext;
  const u=await sb.storage.from('avatars').upload(p,f,{contentType:f.type||'image/png'});if(u.error)return toast(u.error.message);
  const url=sb.storage.from('avatars').getPublicUrl(p).data.publicUrl;
  const{error}=await sb.from('profiles').update({avatar_url:url}).eq('id',S.me);if(error)return toast(error.message);
  S.prof.avatar_url=url;S.pp[S.me]=S.prof;render()};
async function redeem(){const{data,error}=await sb.rpc('redeem_admin_code',{code:$('ac').value.trim()});
  if(error||!data)return toast(t('admbad'));S.prof.is_admin=true;S.pp[S.me]=S.prof;toast(t('admok'));render()}
const STK=['😀','😂','🥹','😍','😎','🤔','😭','😡','👍','👏','🙏','🔥','🎉','❤️','💀','🤝','😴','🤯','🥳','😅','🫡','💯','✨','🍕'];
$('sp').replaceChildren(...STK.map(x=>h('button',{type:'button',onclick:async()=>{$('sp').hidden=true;if(!S.peer)return;const{error}=await sb.from('messages').insert({...tgt(),kind:'sticker',content:x});error?toast(error.message):loadAll()}},x)));
$('stb').onclick=()=>{$('sp').hidden=!$('sp').hidden};

function fxBlock(){
  const P=S.prof,seg2=(items,cur,key)=>h('div',{class:'seg'},...items.map(v=>h('button',{class:(cur||'none')===v?'on':'',onclick:()=>saveFx({[key]:v})},t('f_'+v))));
  return h('div',{class:'set'},h('p',{},t('fxh')),h('p',{style:'font-size:1.3rem'},nmx(P,P.display_name||'@'+P.username)),
    h('p',{},t('ncolor')),h('div',{class:'acts'},h('input',{type:'color',value:P.name_color||'#7f9bff',onchange:e=>saveFx({name_color:e.target.value})}),h('button',{class:'ghost',onclick:()=>saveFx({name_color:null})},t('reset'))),
    h('p',{style:'margin-top:.8rem'},t('fx')),seg2(['none','glow','pulse','shimmer','rainbow'],P.name_fx,'name_fx'),
    h('p',{},t('frame')),seg2(['none','neon','gold','rainbow'],P.frame,'frame'));
}
async function saveFx(patch){const{error}=await sb.from('profiles').update(patch).eq('id',S.me);if(error)return toast(error.message);Object.assign(S.prof,patch);S.pp[S.me]=S.prof;render()}
const convs=()=>[...friends(),...S.gr.map(g=>'g:'+g.id)];
const unread=id=>{if(id===S.me)return 0;if(isG(id)){const g=id.slice(2),mm=S.gm.find(x=>x.group_id===g&&x.user_id===S.me);return mm?S.msgs.filter(m=>m.group_id===g&&m.sender_id!==S.me&&m.created_at>mm.last_read_at).length:0}return S.msgs.filter(m=>m.sender_id===id&&m.recipient_id===S.me&&!m.read_at).length};
const tot=()=>convs().reduce((a,id)=>a+unread(id),0);
const hdr=id=>isG(id)?S.gm.filter(x=>x.group_id===id.slice(2)).map(x=>uname(x.user_id)).join(', '):(S.pp[id]||{}).bio||'';
const mk=new Set();
function markRead(){if(S.tab!=='chats'||!S.peer||S.peer===S.me||document.hidden)return;
  if(isG(S.peer)){const g=S.peer.slice(2),last=S.msgs.filter(m=>m.group_id===g).pop(),k='g'+g+unread(S.peer);
    if(last&&unread(S.peer)&&!mk.has(k)){mk.add(k);sb.from('group_members').update({last_read_at:last.created_at}).eq('group_id',g).eq('user_id',S.me).then(()=>{})}return}
  const ids=S.msgs.filter(m=>m.sender_id===S.peer&&m.recipient_id===S.me&&!m.read_at&&!mk.has(m.id)).map(m=>m.id);if(!ids.length)return;
  ids.forEach(i=>mk.add(i));sb.from('messages').update({read_at:new Date().toISOString()}).in('id',ids).then(()=>{})}
document.addEventListener('visibilitychange',markRead);
function closeLb(){const lb=$('lb');lb.hidden=true;lb.replaceChildren()}
addEventListener('popstate',()=>{
  if(!$('lb').hidden){closeLb();return}
  if(S.tab!=='chats'){S.tab='chats';S.peer=wide()?S.me:null;render();return}
  if(S.peer&&!wide()){S.peer=null;render()}});
async function copyText(x){try{await navigator.clipboard.writeText(x);toast(t('copied'))}catch{toast('Error')}}
function openDlg(n){const d=$('dlg');d.replaceChildren(n);d.hidden=false;d.onclick=e=>{if(e.target===d)closeDlg()}}
function closeDlg(){const d=$('dlg');d.hidden=true;d.replaceChildren()}
function msgMenu(m){const mine=m.sender_id===S.me,b=[];
  if(m.kind==='text'||m.kind==='link')b.push(['copy',()=>copyText(m.content)]);
  if(m.kind==='file')b.push(['dl',()=>dl(m)]);
  if(mine&&m.kind==='text')b.push(['edit',()=>editMsg(m)]);
  if(mine)b.push(['del',()=>del(m)]);
  if(b.length)openDlg(h('div',{class:'mn'},...b.map(([k,f])=>h('button',{onclick:()=>{closeDlg();f()}},t(k)))))}
function editMsg(m){const ta=h('textarea',{rows:3});ta.value=m.content;
  openDlg(h('div',{class:'mn'},ta,h('button',{class:'btn',onclick:async()=>{const v=ta.value.trim();if(!v)return;const{error}=await sb.from('messages').update({content:v,edited_at:new Date().toISOString()}).eq('id',m.id);closeDlg();error?toast(error.message):loadAll()}},t('save'))));ta.focus()}
function newGroup(){const sel=new Set(),inp=h('input',{placeholder:t('gname'),maxlength:40});
  openDlg(h('div',{class:'mn'},h('b',{},t('newgrp')),inp,h('p',{style:'margin:.3rem 0;color:var(--mut);font-size:.9rem'},t('members')),
    ...friends().map(id=>h('label',{class:'chk'},h('input',{type:'checkbox',onchange:e=>e.target.checked?sel.add(id):sel.delete(id)}),av(id),uname(id))),
    h('button',{class:'btn',onclick:()=>{const n=inp.value.trim();if(n&&sel.size)mkGroup(n,[...sel]);else toast(t('gname'))}},t('create'))))}
async function mkGroup(name,ids){const id=crypto.randomUUID();
  let r=await sb.from('groups').insert({id,name});if(r.error)return toast(r.error.message);
  r=await sb.from('group_members').insert([S.me,...ids].map(u=>({group_id:id,user_id:u})));if(r.error)return toast(r.error.message);
  closeDlg();S.tab='chats';S.peer='g:'+id;if(!wide())history.pushState({c:1},'');await loadAll()}
async function leaveG(){const g=S.peer.slice(2),{error}=await sb.from('group_members').delete().eq('group_id',g).eq('user_id',S.me);
  if(error)return toast(error.message);S.peer=null;if(history.state&&history.state.c)history.back();await loadAll()}
function usersBlock(){if(!S.users)loadUsers();const u=S.users||[];
  return h('div',{class:'set'},h('p',{},t('users')+' ('+u.length+', '+u.filter(x=>S.on.has(x.id)).length+' '+t('online')+')'),
    ...u.map(x=>h('div',{class:'frow'},h('span',{class:'who'},av(x.id),nmx(S.pp[x.id]||{},uname(x.id))),h('small',{style:'color:var(--mut)'},S.on.has(x.id)?'● '+t('online'):''))))}
async function loadUsers(){const{data}=await sb.from('profiles').select('id,username,display_name,bio,avatar_url,is_admin,name_color,name_fx,frame').order('created_at',{ascending:false}).limit(200);
  S.users=data||[];S.users.forEach(r=>{S.pf[r.id]=r.username;S.pp[r.id]=r});if(S.tab==='settings')render()}
let ip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(S.me&&S.prof&&S.tab==='settings')render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();applyLang();
</script>
</body>
